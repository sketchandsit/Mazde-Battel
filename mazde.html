<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>
:root{color-scheme:dark;--bg:#14260f;--ink:#fff;--g:#6fd12e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14260f;--ink:#fff}}
:root[data-theme="dark"]{--bg:#14260f;--ink:#fff}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;font-family:'Lilita One','Arial Black',Impact,sans-serif}
#app{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
#stage{position:relative;overflow:hidden;background:#3a8d28}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#menu,#modal{position:absolute;inset:0;display:none}
#menu{background-size:cover;background-position:center}
.hs{position:absolute;background:transparent;border:0;cursor:pointer;border-radius:12px}
.hs:active{background:rgba(255,255,255,.18)}
#modal{align-items:center;justify-content:center;background:rgba(8,20,6,.72);z-index:5}
.box{width:82%;padding:1em 1em .7em;text-align:center;background:linear-gradient(#2d3a2a,#18241a);border:.12em solid var(--g);border-radius:.8em;box-shadow:0 0 1.2em rgba(111,209,46,.5);font-size:1em}
.box h1{margin:.1em 0 .3em;font-weight:400;font-size:1.9em;color:#b9ff7a;text-shadow:0 .08em 0 #000}
.box p{margin:.3em 0 .6em;font-size:.95em;line-height:1.3;color:#e6f5d8}
.btn{display:block;width:88%;margin:.45em auto;padding:.5em;font:inherit;font-size:1.05em;color:#fff;background:linear-gradient(#4a4f5c,#2c303a);border:.1em solid #8a93a6;border-radius:.6em}
.btn.go{background:linear-gradient(#7fe03a,#3f9b14);border-color:#d6ff9c;text-shadow:0 .06em 0 #1d4a05}
.btn:active{transform:scale(.97)}
</style></head><body>

for(const p of g.pr){cx.save();cx.shadowBlur=14;if(p.k=='sling'){cx.fillStyle='#d8d0c0';cx.shadowColor='#fff';cx.beginPath();cx.arc(p.x,p.y,7,0,7);cx.fill()}else{cx.fillStyle=p.k=='magic'?'#d28bff':'#a05bff';cx.shadowColor='#b06bff';cx.beginPath();cx.arc(p.x,p.y,p.k=='magic'?13:10,0,7);cx.fill();cx.fillStyle='#fff';cx.beginPath();cx.arc(p.x,p.y,4,0,7);cx.fill()}cx.restore()}

if(g.ht>0||g.sel>=0){cx.fillStyle='rgba(15,25,14,.85)';rr(150,1360,642,50,16);cx.fill();txt(g.ht>0?g.hint:(U[ORDER[g.sel]].n+' – Feld wählen'),471,1386,28,g.ht>0?'#ffb0a0':'#c9ff8a')}

cx.fillStyle='#39465a';rr(c[0],y,c[2],c[3],18);cx.fill();cx.restore();cx.fillStyle='#51617a';rr(c[0]+6,y+6,c[2]-12,c[3]-12,14);cx.fill();
const im=IM[k],sh=im.height*.55,sc=Math.min((c[2]-24)/im.width,(c[3]-62)/sh);cx.drawImage(im,0,0,im.width,sh,c[0]+c[2]/2-im.width*sc/2,y+10,im.width*sc,sh*sc);
cx.fillStyle='#b020e8';cx.beginPath();cx.arc(c[0]+c[2]/2,y+c[3]-24,26,0,7);cx.fill();cx.strokeStyle='#f1c2ff';cx.lineWidth=4;cx.stroke();txt(u.c,c[0]+c[2]/2,y+c[3]-23,34);
if(!ok){cx.fillStyle='rgba(8,8,20,.6)';rr(c[0],y,c[2],c[3],18);cx.fill()}
if(sel){cx.strokeStyle='#caff6a';cx.lineWidth=7;rr(c[0],y,c[2],c[3],18);cx.stroke()}});

if(g.ban){const t=g.ban.t,a=Math.min(1,t*2,(2.5-t)*3);cx.globalAlpha=Math.max(0,a);cx.fillStyle='rgba(10,20,8,.65)';cx.fillRect(0,700,W,150);txt(g.ban.s,W/2,775,76,'#d6ff8a');cx.globalAlpha=1}

cx.restore()}
let last=performance.now();
function loop(n){const dt=Math.min(.05,(n-last)/1000);last=n;T+=dt;if(state=='play'&&G)update(dt);else if(G&&state=='over'){G.pa.forEach(p=>p.l+=dt)}
if(G&&state!='menu')draw();else if(!G){cx.clearRect(0,0,W,H)}requestAnimationFrame(loop)}
